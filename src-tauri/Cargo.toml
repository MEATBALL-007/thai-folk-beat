[package]
name = "thai-folk-beat"
version = "0.1.0"
description = "THAI FOLK BEAT — an Isan folk music rhythm game"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
